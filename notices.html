<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bus office — The notices</title>
  <link rel="stylesheet" href="lab05.css">
</head>
<body>
  <header class="top" style="background-color: olive; color: white;">
    <h1>Bus office</h1>
  </header>

  <main>
    <p id="status">Six notices are pinned on the wall.</p>

    <div id="wall">
      <div class="row">
        <p class="notice"><span>Welcome</span></p>
        <p class="notice"><span>Hours</span></p>
        <p class="notice"><span>Fire</span></p>
      </div>
      <div class="row">
        <p class="notice"><span>Rules</span></p>
        <p class="notice"><span>Map</span></p>
        <p class="notice"><span>Close</span></p>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="up">Up</button>
      <button type="button" id="down">Down</button>
      <button type="button" id="left">Left</button>
      <button type="button" id="right">Right</button>
      <input type="text" id="spot" placeholder="Position (1-6)">
      <button type="button" id="move">Move</button>
    </div>

    <p>Fire position: <span id="fire-at">3</span></p>
  </main>

  <footer>
    <p>BSCS-F24-A · 247215</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
